name: PR Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history so SonarCloud can resolve main and classify new code.
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install tox
        run: pip install tox

      - name: Run linters
        run: tox -e linters

      - name: Run unit tests
        run: tox -e unittest

      - name: Run code coverage
        run: tox -e coverage

      # https://handbook.eng.ansible.com/Quality/sonar-config
      # The SonarCloud token secret name differs by org. SONAR_TOKEN_SECRET_NAME
      # holds that name; do not read secrets.SONAR_TOKEN directly.
      - name: Extract and export repo owner/name
        shell: bash
        run: |
          REPO_SLUG="${GITHUB_REPOSITORY}"
          IFS="/" read -r REPO_OWNER REPO_NAME <<< "$REPO_SLUG"
          echo "REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.organization=${{ env.REPO_OWNER }}

